name: Deploy site

on:
  push:
    branches: [main]
    paths: ['docs/**', 'site/**', 'scripts/**', 'web/public/**', 'web/src/tokens.css', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  # https://asyncup-dev.github.io/ — the landing page at the root, docs under
  # /docs/ — published by pushing the build to asyncup-dev/asyncup-dev.github.io.
  # Needs SITE_DEPLOY_KEY (a deploy key with write access to that repository)
  # on this repository; skipped silently where it is absent, such as forks.
  publish:
    runs-on: ubuntu-latest
    steps:
      - id: key
        env:
          KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v7
      - if: steps.key.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - if: steps.key.outputs.present == 'true'
        run: bun install --frozen-lockfile
      - if: steps.key.outputs.present == 'true'
        run: SITE_BASE=/ bun run site:build
      - if: steps.key.outputs.present == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: asyncup-dev/asyncup-dev.github.io
          publish_branch: main
          publish_dir: site-dist
          cname: false
          commit_message: 'Publish site from asyncup@${{ github.sha }}'
